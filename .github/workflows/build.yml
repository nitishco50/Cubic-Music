name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "composeApp/**"
      - "extensions/**"
      - "modules/**"
      - "assets/Better-Lyrics-main/**"
      - "*.gradle.kts"
      - "**/*.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          set -e
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDKROOT" -path '*/cmdline-tools/*/bin/sdkmanager' | head -n1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" </dev/null

      - name: Build assembleFull
        run: bash ./gradlew assembleFull --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          OUT_DIR="composeApp/build/outputs/apk/full"
          ls -la "$OUT_DIR"
          UNSIGNED="$(ls "$OUT_DIR"/*.apk | head -n1)"
          echo "Signing: $UNSIGNED"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystore.p12" \
            --ks-type pkcs12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/Cubic-Music-full.apk" \
            "$UNSIGNED"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/Cubic-Music-full.apk"
          cp "$RUNNER_TEMP/Cubic-Music-full.apk" "$OUT_DIR/Cubic-Music-full-signed.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cubic-Music-full
          path: composeApp/build/outputs/apk/full/Cubic-Music-full-signed.apk
          if-no-files-found: error
          retention-days: 14
